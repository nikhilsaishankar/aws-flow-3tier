    <text x="416" y="922" text-anchor="middle" font-size="10" fill="#9ca3af">Private1-Flm · Apache/PHP</text>
  </g>

  <!-- Private Subnet AZ-2 (compute) -->
  <rect x="640" y="760" width="410" height="180" rx="10" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <g>
    <rect x="658" y="776" width="18" height="18" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
    <path d="M661,781 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
