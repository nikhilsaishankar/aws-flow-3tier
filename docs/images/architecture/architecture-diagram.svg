    <symbol id="i-users" viewBox="0 0 32 32">
      <circle cx="12" cy="10" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M3,26 c0,-8 6,-11 9,-11 s9,3 9,11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="12" r="4" fill="none" stroke="#c7d2fe" stroke-width="2"/>
      <path d="M16,26 c0.5,-6.5 5,-9 9,-9 s7,3 7,9" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-globe" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="16" cy="16" rx="5" ry="12" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <line x1="4" y1="16" x2="28" y2="16" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M6,10 h20 M6,22 h20" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    </symbol>

    <symbol id="i-igw" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#ffffff" stroke-width="2.3"/>
      <line x1="9" y1="16" x2="23" y2="16" stroke="#ffffff" stroke-width="2.3"/>
    </symbol>

    <symbol id="i-nat" viewBox="0 0 32 32">
      <rect x="6" y="10" width="20" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M10,16 h12 m-5,-5 l5,5 l-5,5" fill="none" stroke="#ffffff" stroke-width="2"/>
    </symbol>

    <symbol id="i-hub" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="4" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="16" y1="12" x2="16" y2="5" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="19" y1="18.5" x2="25" y2="23" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="13" y1="18.5" x2="7" y2="23" stroke="#ffffff" stroke-width="2.2"/>
      <circle cx="16" cy="5" r="2" fill="#ffffff"/>
      <circle cx="25" cy="23" r="2" fill="#ffffff"/>
      <circle cx="7" cy="23" r="2" fill="#ffffff"/>
    </symbol>

    <symbol id="i-chip" viewBox="0 0 32 32">
      <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="12" y1="9" x2="12" y2="5" stroke="#ffffff" stroke-width="2"/>
      <line x1="16" y1="9" x2="16" y2="5" stroke="#ffffff" stroke-width="2"/>
      <line x1="20" y1="9" x2="20" y2="5" stroke="#ffffff" stroke-width="2"/>
      <line x1="12" y1="23" x2="12" y2="27" stroke="#ffffff" stroke-width="2"/>
      <line x1="16" y1="23" x2="16" y2="27" stroke="#ffffff" stroke-width="2"/>
      <line x1="20" y1="23" x2="20" y2="27" stroke="#ffffff" stroke-width="2"/>
    </symbol>

    <symbol id="i-db" viewBox="0 0 32 32">
      <ellipse cx="16" cy="9" rx="10" ry="4" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M6,9 v14 a10,4 0 0 0 20,0 v-14" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M6,16 a10,4 0 0 0 20,0" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    </symbol>

    <symbol id="i-shield" viewBox="0 0 32 32">
      <path d="M16,5 l10,4 v9 c0,7.5 -5,11.5 -10,13.5 c-5,-2 -10,-6 -10,-13.5 v-9 z" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M11,16 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-list" viewBox="0 0 32 32">
      <rect x="6" y="8" width="20" height="5" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <rect x="6" y="17" width="20" height="5" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    </symbol>

    <symbol id="i-doc" viewBox="0 0 32 32">
      <path d="M9,5 h10 l6,6 v16 h-16 z" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M19,5 v6 h6" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round"/>
      <line x1="12" y1="18" x2="20" y2="18" stroke="#ffffff" stroke-width="1.7"/>
      <line x1="12" y1="23" x2="20" y2="23" stroke="#ffffff" stroke-width="1.7"/>
    </symbol>

    <symbol id="i-image" viewBox="0 0 32 32">
      <rect x="5" y="7" width="22" height="18" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.1"/>
      <circle cx="12" cy="14" r="2.4" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M6,23 l7,-7 l5,5 l4,-4 l6,6" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-scale" viewBox="0 0 32 32">
      <rect x="6" y="12" width="7" height="14" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="14.5" y="7" width="7" height="19" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="23" y="16" width="7" height="10" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M6,4 l5,-3 l5,3" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,3)"/>
    </symbol>
