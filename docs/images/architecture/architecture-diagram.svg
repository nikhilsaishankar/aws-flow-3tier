<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#16213e">AWS 3-Tier Architecture — Request Flow</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#6b7280">Multi-AZ VPC • Public / Private Subnets • Auto Scaling • Private RDS</text>

  <!-- Users -->
  <g>
    <rect x="30" y="96" width="130" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="75" cy="126" r="9" fill="#2563eb"/>
    <path d="M62,146 q13,-14 26,0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="128" r="7" fill="#93c5fd"/>
    <path d="M90,144 q10,-11 20,0" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Users</text>
  </g>

  <line x1="160" y1="139" x2="222" y2="139" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="191" y="128" text-anchor="middle" font-size="10" fill="#6b7280">HTTPS</text>

  <!-- Internet Gateway -->
  <g>
    <rect x="228" y="96" width="150" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="303" cy="126" r="13" fill="none" stroke="#059669" stroke-width="3"/>
    <line x1="290" y1="126" x2="316" y2="126" stroke="#059669" stroke-width="3"/>
    <text x="303" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Internet Gateway</text>
    <text x="303" y="176" text-anchor="middle" font-size="9.5" fill="#047857">FLM-IGW</text>
  </g>

  <line x1="303" y1="182" x2="303" y2="212" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC outer container: y 212 -> 872 (height 660) -->
  <rect x="30" y="212" width="840" height="660" rx="14" fill="#f8fafc" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="55" y="238" font-size="13.5" font-weight="700" fill="#065f46">VPC · 10.0.0.0/16 — spans 2 Availability Zones (us-east-1a / us-east-1b)</text>

  <!-- Left security column: y 254 -> 852 (height 598) -->
  <rect x="50" y="254" width="150" height="598" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="125" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">SECURITY &amp;</text>
  <text x="125" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">NETWORK</text>

  <!-- Security groups icon -->
  <g>
    <rect x="70" y="306" width="110" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M125,320 l20,8 v20 c0,15 -9,24 -20,28 c-11,-4 -20,-13 -20,-28 v-20 z" fill="none" stroke="#16a34a" stroke-width="2.2"/>
    <text x="125" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Security Groups</text>
  </g>

  <!-- NAT gateway icon -->
  <g>
    <rect x="70" y="428" width="110" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <rect x="100" y="450" width="50" height="32" rx="6" fill="none" stroke="#ea580c" stroke-width="2.2"/>
    <path d="M108,466 h34 m-8,-6 l8,6 l-8,6" fill="none" stroke="#ea580c" stroke-width="2"/>
    <text x="125" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">NAT Gateway</text>
  </g>

  <!-- Route tables icon -->
  <g>
    <rect x="70" y="550" width="110" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="95" y="570" width="60" height="10" rx="2" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="95" y="586" width="60" height="10" rx="2" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="95" y="602" width="60" height="10" rx="2" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="125" y="636" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Route Tables</text>
  </g>

  <!-- Subnets icon -->
  <g>
    <rect x="70" y="672" width="110" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="90" y="690" width="35" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="132" y="690" width="35" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="125" y="742" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">Public / Private</text>
    <text x="125" y="754" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">Subnets</text>
  </g>

  <!-- internal connectors within the security column -->
  <line x1="125" y1="406" x2="125" y2="428" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="125" y1="528" x2="125" y2="550" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="125" y1="650" x2="125" y2="672" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- security column governs the traffic + compute layers -->
  <line x1="202" y1="560" x2="220" y2="560" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Traffic distribution layer: y 254 -> 394 -->
  <rect x="222" y="254" width="628" height="140" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="536" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">TRAFFIC DISTRIBUTION LAYER — PUBLIC SUBNETS (AZ-1 / AZ-2)</text>
  <g>
    <rect x="436" y="292" width="200" height="82" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
    <circle cx="470" cy="333" r="14" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="470" y1="333" x2="470" y2="319" stroke="#7c3aed" stroke-width="2"/>
    <line x1="470" y1="333" x2="481" y2="340" stroke="#7c3aed" stroke-width="2"/>
    <line x1="470" y1="333" x2="459" y2="340" stroke="#7c3aed" stroke-width="2"/>
    <text x="545" y="329" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Application</text>
    <text x="545" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Load Balancer</text>
    <text x="545" y="360" text-anchor="middle" font-size="9.5" fill="#6d28d9">Distributes incoming traffic</text>
  </g>

  <line x1="536" y1="394" x2="536" y2="424" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compute layer: y 424 -> 684 -->
  <rect x="222" y="424" width="628" height="260" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="536" y="446" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">COMPUTE LAYER — AUTO SCALING GROUP (PRIVATE SUBNETS)</text>

  <g>
    <rect x="440" y="458" width="192" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
    <text x="536" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Auto Scaling Group · desired 2, max 5</text>
  </g>

  <line x1="480" y1="492" x2="480" y2="512" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="592" y1="492" x2="592" y2="512" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- EC2 AZ-1 -->
  <g>
    <rect x="330" y="512" width="180" height="130" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <rect x="380" y="532" width="80" height="60" rx="6" fill="none" stroke="#ea580c" stroke-width="2.2"/>
    <line x1="392" y1="532" x2="392" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="420" y1="532" x2="420" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="448" y1="532" x2="448" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="392" y1="592" x2="392" y2="602" stroke="#ea580c" stroke-width="2"/>
    <line x1="420" y1="592" x2="420" y2="602" stroke="#ea580c" stroke-width="2"/>
    <line x1="448" y1="592" x2="448" y2="602" stroke="#ea580c" stroke-width="2"/>
    <text x="420" y="622" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">EC2 · AZ-1</text>
    <text x="420" y="635" text-anchor="middle" font-size="9" fill="#c2410c">Private1-Flm · Apache/PHP</text>
  </g>

  <!-- EC2 AZ-2 -->
  <g>
    <rect x="562" y="512" width="180" height="130" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <rect x="612" y="532" width="80" height="60" rx="6" fill="none" stroke="#ea580c" stroke-width="2.2"/>
    <line x1="624" y1="532" x2="624" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="652" y1="532" x2="652" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="680" y1="532" x2="680" y2="522" stroke="#ea580c" stroke-width="2"/>
    <line x1="624" y1="592" x2="624" y2="602" stroke="#ea580c" stroke-width="2"/>
    <line x1="652" y1="592" x2="652" y2="602" stroke="#ea580c" stroke-width="2"/>
    <line x1="680" y1="592" x2="680" y2="602" stroke="#ea580c" stroke-width="2"/>
    <text x="652" y="622" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">EC2 · AZ-2</text>
    <text x="652" y="635" text-anchor="middle" font-size="9" fill="#c2410c">Private2-Flm · Apache/PHP</text>
  </g>

  <line x1="420" y1="642" x2="480" y2="664" stroke="#374151" stroke-width="1.6"/>
  <line x1="652" y1="642" x2="592" y2="664" stroke="#374151" stroke-width="1.6"/>
  <line x1="480" y1="664" x2="536" y2="684" stroke="#374151" stroke-width="1.6"/>
  <line x1="592" y1="664" x2="536" y2="684" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Data layer: y 704 -> 834 -->
  <rect x="222" y="704" width="628" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="536" y="726" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">DATA LAYER — PRIVATE SUBNET</text>

  <g>
    <rect x="436" y="740" width="200" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <ellipse cx="486" cy="762" rx="24" ry="9" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <path d="M462,762 v22 a24,9 0 0 0 48,0 v-22" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <text x="562" y="774" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Amazon RDS</text>
    <text x="562" y="789" text-anchor="middle" font-size="9.5" fill="#1d4ed8">MySQL · flm-db</text>
    <text x="562" y="802" text-anchor="middle" font-size="9" fill="#3b82f6">db.t3.micro</text>
  </g>

  <!-- Legend (outside VPC box) -->
  <g font-size="10.5" fill="#374151">
    <rect x="60" y="906" width="14" height="14" rx="3" fill="#a7f3d0" stroke="#059669"/>
    <text x="80" y="917">Networking</text>

    <rect x="200" y="906" width="14" height="14" rx="3" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="220" y="917">Traffic Distribution</text>

    <rect x="380" y="906" width="14" height="14" rx="3" fill="#fed7aa" stroke="#ea580c"/>
    <text x="400" y="917">Compute (Auto Scaling)</text>

    <rect x="590" y="906" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="610" y="917">Database</text>

    <rect x="710" y="906" width="14" height="14" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="730" y="917">Security &amp; Routing</text>
  </g>

  <text x="450" y="960" text-anchor="middle" font-size="11.5" fill="#6b7280">Users -&gt; Internet Gateway -&gt; VPC -&gt; Public Subnet (ALB) -&gt; Private Subnet (Auto Scaling Group) -&gt; RDS</text>
</svg>
