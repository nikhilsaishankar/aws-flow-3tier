  <!-- background -->
  <rect x="0" y="0" width="1440" height="1330" fill="#0a0d14"/>

  <!-- Users -->
  <g>
    <use href="#i-users" x="524" y="24" width="52" height="52"/>
    <text x="550" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Users</text>
  </g>

  <line x1="590" y1="52" x2="716" y2="52" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Internet -->
  <g>
    <use href="#i-globe" x="724" y="24" width="52" height="52"/>
    <text x="750" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Internet</text>
  </g>

  <line x1="750" y1="112" x2="750" y2="146" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AWS Cloud outer container -->
  <rect x="40" y="150" width="1360" height="1040" rx="18" fill="#0d1117" stroke="#e5e7eb" stroke-width="1.6" stroke-opacity="0.55"/>
  <rect x="62" y="168" width="30" height="30" rx="7" fill="#ff9900"/>
  <text x="77" y="189" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0a0d14">aws</text>
  <text x="102" y="190" font-size="16" font-weight="700" fill="#ffffff">AWS Cloud</text>

  <!-- Internet Gateway -->
  <g>
    <rect x="716" y="212" width="68" height="68" rx="14" fill="#6d5bd0"/>
    <use href="#i-igw" x="726" y="222" width="48" height="48"/>
    <text x="750" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Internet Gateway</text>
    <text x="750" y="320" text-anchor="middle" font-size="10.5" fill="#9ca3af">FLM-IGW</text>
  </g>

  <line x1="750" y1="326" x2="750" y2="352" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC container -->
  <rect x="170" y="352" width="900" height="808" rx="16" fill="#22c55e" fill-opacity="0.05" stroke="#22c55e" stroke-width="2.2"/>
  <g>
    <rect x="190" y="368" width="26" height="26" rx="6" fill="none" stroke="#4ade80" stroke-width="2"/>
    <path d="M196,381 h14 m-9,-5 l0,10 m8,-10 l0,10" stroke="#4ade80" stroke-width="1.6" fill="none"/>
  </g>
  <text x="226" y="388" font-size="15" font-weight="700" fill="#4ade80">VPC · 10.0.0.0/16 — 2 Availability Zones</text>

  <!-- Application Load Balancer -->
  <g>
    <circle cx="620" cy="446" r="30" fill="#6d5bd0"/>
    <use href="#i-hub" x="596" y="422" width="48" height="48"/>
    <text x="620" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Application Load Balancer</text>
    <text x="620" y="513" text-anchor="middle" font-size="10.5" fill="#9ca3af">Public Subnets · AZ-1 / AZ-2</text>
  </g>

  <line x1="580" y1="500" x2="440" y2="548" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="660" y1="500" x2="850" y2="548" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Public Subnet AZ-1 -->
  <rect x="210" y="550" width="410" height="180" rx="10" fill="#22c55e" fill-opacity="0.04" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <g>
    <rect x="228" y="566" width="18" height="18" rx="3" fill="none" stroke="#4ade80" stroke-width="1.8"/>
    <path d="M231,571 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#4ade80" stroke-width="1.6"/>
  </g>
  <text x="254" y="580" font-size="13" font-weight="700" fill="#4ade80">Public Subnet · AZ-1</text>
  <g>
    <rect x="272" y="612" width="60" height="60" rx="13" fill="#6d5bd0"/>
    <use href="#i-hub" x="280" y="620" width="44" height="44"/>
    <text x="302" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">ALB Node</text>
  </g>
  <g>
    <rect x="466" y="612" width="60" height="60" rx="13" fill="#6d5bd0"/>
    <use href="#i-nat" x="474" y="620" width="44" height="44"/>
    <text x="496" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">NAT Gateway</text>
    <text x="496" y="712" text-anchor="middle" font-size="10" fill="#9ca3af">FLM-NAT</text>
  </g>

