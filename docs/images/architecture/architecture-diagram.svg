    <text x="845" y="922" text-anchor="middle" font-size="10" fill="#9ca3af">Private2-Flm · Apache/PHP</text>
  </g>

  <!-- converge to data layer -->
  <line x1="416" y1="940" x2="600" y2="982" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="845" y1="940" x2="660" y2="982" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Data layer -->
  <rect x="210" y="980" width="840" height="160" rx="10" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="230" y="1006" font-size="13" font-weight="700" fill="#60a5fa">Private Subnet — Data Layer</text>
  <g>
    <rect x="598" y="1018" width="64" height="64" rx="14" fill="#3b6fd4"/>
    <use href="#i-db" x="606" y="1026" width="48" height="48"/>
    <text x="630" y="1104" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Amazon RDS</text>
    <text x="630" y="1120" text-anchor="middle" font-size="10.5" fill="#9ca3af">MySQL · flm-db · db.t3.micro</text>
  </g>

  <!-- Right supporting-services panel -->
