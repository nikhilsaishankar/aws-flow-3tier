  <g>
    <rect x="658" y="566" width="18" height="18" rx="3" fill="none" stroke="#4ade80" stroke-width="1.8"/>
    <path d="M661,571 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#4ade80" stroke-width="1.6"/>
  </g>
  <text x="684" y="580" font-size="13" font-weight="700" fill="#4ade80">Public Subnet · AZ-2</text>
  <g>
    <rect x="815" y="612" width="60" height="60" rx="13" fill="#6d5bd0"/>
    <use href="#i-hub" x="823" y="620" width="44" height="44"/>
    <text x="845" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">ALB Node</text>
  </g>

  <!-- arrows down to compute layer -->
  <line x1="416" y1="730" x2="416" y2="758" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="845" y1="730" x2="845" y2="758" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Private Subnet AZ-1 (compute) -->
  <rect x="210" y="760" width="410" height="180" rx="10" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <g>
    <rect x="228" y="776" width="18" height="18" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
    <path d="M231,781 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
  </g>
  <text x="254" y="790" font-size="13" font-weight="700" fill="#60a5fa">Private Subnet · AZ-1</text>
  <g>
    <rect x="386" y="822" width="60" height="60" rx="13" fill="#f7941d"/>
    <use href="#i-chip" x="394" y="830" width="44" height="44"/>
