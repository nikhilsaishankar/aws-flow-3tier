  <text x="1122" y="386" font-size="13" font-weight="700" fill="#e5e7eb" letter-spacing="0.5">SUPPORTING RESOURCES</text>

  <g>
    <rect x="1122" y="414" width="46" height="46" rx="10" fill="#ef4444"/>
    <use href="#i-shield" x="1129" y="421" width="32" height="32"/>
    <text x="1180" y="434" font-size="13" font-weight="700" fill="#ffffff">Security Groups</text>
    <text x="1180" y="450" font-size="10" fill="#9ca3af">RDS · SG-Flm-App</text>
  </g>

  <g>
    <rect x="1122" y="494" width="46" height="46" rx="10" fill="#22c55e"/>
    <use href="#i-list" x="1129" y="501" width="32" height="32"/>
    <text x="1180" y="514" font-size="13" font-weight="700" fill="#ffffff">Route Tables</text>
    <text x="1180" y="530" font-size="10" fill="#9ca3af">Public / Private</text>
  </g>

  <g>
    <rect x="1122" y="574" width="46" height="46" rx="10" fill="#f7941d"/>
    <use href="#i-doc" x="1129" y="581" width="32" height="32"/>
    <text x="1180" y="594" font-size="13" font-weight="700" fill="#ffffff">Launch Template</text>
    <text x="1180" y="610" font-size="10" fill="#9ca3af">MyFLM</text>
  </g>

  <g>
    <rect x="1122" y="654" width="46" height="46" rx="10" fill="#f7941d"/>
    <use href="#i-image" x="1129" y="661" width="32" height="32"/>
    <text x="1180" y="674" font-size="13" font-weight="700" fill="#ffffff">AMI</text>
    <text x="1180" y="690" font-size="10" fill="#9ca3af">Golden image</text>
  </g>

  <g>
    <rect x="1122" y="734" width="46" height="46" rx="10" fill="#f7941d"/>
    <use href="#i-scale" x="1129" y="741" width="32" height="32"/>
    <text x="1180" y="754" font-size="13" font-weight="700" fill="#ffffff">Auto Scaling Group</text>
    <text x="1180" y="770" font-size="10" fill="#9ca3af">Desired 2 · Max 5</text>
  </g>

  <g>
    <rect x="1122" y="814" width="46" height="46" rx="10" fill="#6d5bd0"/>
    <use href="#i-hub" x="1129" y="821" width="32" height="32"/>
    <text x="1180" y="834" font-size="13" font-weight="700" fill="#ffffff">Target Group</text>
    <text x="1180" y="850" font-size="10" fill="#9ca3af">flm-tg · private subnets</text>
  </g>

  <!-- Build & Deployment flow strip -->
  <rect x="40" y="1210" width="1360" height="150" rx="16" fill="#0d1117" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  <text x="64" y="1238" font-size="12.5" font-weight="700" fill="#9ca3af" letter-spacing="0.8">BUILD &amp; DEPLOYMENT FLOW</text>

  <g>
    <rect x="90" y="1256" width="52" height="52" rx="12" fill="#f7941d"/>
    <use href="#i-chip" x="99" y="1265" width="34" height="34"/>
    <text x="116" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Build &amp; Test EC2</text>
  </g>
  <line x1="150" y1="1282" x2="290" y2="1282" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="298" y="1256" width="52" height="52" rx="12" fill="#f7941d"/>
    <use href="#i-image" x="307" y="1265" width="34" height="34"/>
    <text x="324" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Create AMI</text>
  </g>
  <line x1="358" y1="1282" x2="498" y2="1282" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="506" y="1256" width="52" height="52" rx="12" fill="#f7941d"/>
    <use href="#i-doc" x="515" y="1265" width="34" height="34"/>
    <text x="532" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Launch Template</text>
  </g>
  <line x1="566" y1="1282" x2="706" y2="1282" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="714" y="1256" width="52" height="52" rx="12" fill="#f7941d"/>
    <use href="#i-scale" x="723" y="1265" width="34" height="34"/>
    <text x="740" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Auto Scaling Group</text>
  </g>
  <line x1="774" y1="1282" x2="914" y2="1282" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="922" y="1256" width="52" height="52" rx="12" fill="#6d5bd0"/>
    <use href="#i-hub" x="931" y="1265" width="34" height="34"/>
    <text x="948" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Attach to ALB</text>
  </g>
  <line x1="982" y1="1282" x2="1122" y2="1282" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="1130" y="1256" width="52" height="52" rx="12" fill="#3b6fd4"/>
    <use href="#i-db" x="1139" y="1265" width="34" height="34"/>
    <text x="1156" y="1328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">RDS Connected</text>
  </g>

  <!-- caption -->
  <text x="720" y="1398" text-anchor="middle" font-size="12.5" fill="#6b7280">Users -&gt; Internet Gateway -&gt; VPC -&gt; Public Subnet (ALB / NAT) -&gt; Private Subnet (Auto Scaling EC2) -&gt; RDS</text>
</svg>
